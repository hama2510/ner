[project]
name = "openmed-vietnamese-pii-finetune"
version = "0.1.0"
description = "Fine-tune OpenMed Vietnamese PII token-classification models."
requires-python = ">=3.10,<3.14"
dependencies = [
  "accelerate>=1.6.0",
  "datasets>=3.4.1",
  "evaluate>=0.4.3",
  "numpy>=1.26.0",
  "peft>=0.15.2",
  "protobuf>=7.35.1",
  "safetensors>=0.5.3",
  "seqeval>=1.2.2",
  "tensorboard>=2.19.0",
  "torch>=2.5.0",
  "transformers>=4.51.0,<5.0.0",
]

[tool.uv]
package = false
